databases:
  - name: physioedvance-db
    databaseName: physioedvance
    user: physioedvance
    plan: free

services:
  - type: web
    name: physioedvance
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: physioedvance-db
          property: connectionString

